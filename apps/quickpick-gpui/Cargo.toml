[package]
name = "quickpick-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "QuickPick native Windows desktop application"

[[bin]]
name = "quickpick"
path = "src/main.rs"

[dependencies]
quickpick-core.workspace = true
quickpick-platform.workspace = true

[build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(windows)'.dependencies]
gpui-kit.workspace = true
gpui_windows_backend = { package = "gpui-pre-windows", version = "=0.3.12" }
raw-window-handle = "=0.6.2"
async-channel = "=2.5.0"
global-hotkey = "=0.10.0"
tray-icon = { version = "=0.26.1", default-features = false }
muda = { version = "=0.21.2", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "=1.0.150"
zeroize = "=1.9.0"
