[package]
name = "quickpick"
version = "0.1.2"
description = "Lightweight Windows 11 text selection and screenshot AI tool"
license = "MIT"
authors = ["QuickPick"]
edition = "2021"
default-run = "quickpick"

[lib]
name = "quickpick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quickpick"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
xcap = { version = "0.9.7", default-features = false }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
uiautomation = "0.25"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
axuielement = { version = "0.9.1", default-features = false, features = ["raw-ffi"] }
enigo = { version = "0.6.1", default-features = false }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-os = "2.3.2"

[profile.release]
opt-level = "z"
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
