name: release-macos

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        default: v0.1.3-macos
  push:
    tags:
      - "v*-macos"

jobs:
  release-macos-universal:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          releaseName: QuickPick v0.1.3 macOS
          releaseBody: |
            # QuickPick v0.1.3 macOS

            ## Release notes

            - Publish the macOS universal package from the `feature/macos-port` branch.
            - The project is licensed under MIT.
            - The package is not signed or notarized yet.

            ## Default hotkeys

            - `Command+,`: Settings
            - `Command+Alt+2`: Selection
            - `Command+Alt+3`: Region screenshot
            - `Command+Alt+4`: Input translation

            ## Download

            - macOS universal DMG
          prerelease: true
          args: --target universal-apple-darwin --bundles dmg --ci --no-sign
