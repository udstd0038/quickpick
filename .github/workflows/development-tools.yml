name: development-tools

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  resources:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/native-helper -> target
      - run: pnpm install --frozen-lockfile
      - name: Generate and inspect actual icon and NSIS resources
        run: pnpm test:tools
      - name: Native helper pure tests
        run: cargo test --locked --manifest-path tools/native-helper/Cargo.toml --target-dir tools/native-helper/target
      - name: Cross-check Windows driver APIs
        run: cargo check --locked --manifest-path tools/native-helper/Cargo.toml --target-dir tools/native-helper/target --target x86_64-pc-windows-msvc --tests

  windows-acceptance:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            tools/native-helper -> target
      - run: pnpm install --frozen-lockfile
      - name: Build frontend and default application
        run: |
          call pnpm --filter quickpick-desktop test
          if errorlevel 1 exit /b %errorlevel%
          call pnpm --filter quickpick-desktop build
          if errorlevel 1 exit /b %errorlevel%
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Test opt-in fixture and Windows driver
        run: |
          cargo test --locked --features dev-tools --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
          if errorlevel 1 exit /b %errorlevel%
          cargo test --locked --manifest-path tools/native-helper/Cargo.toml --target-dir tools/native-helper/target
      - name: Build dedicated isolated fixture executable
        run: cargo build --locked --release --features dev-tools,tauri/custom-protocol --bin quickpick-fixture --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Exercise registered hotkeys on an interactive desktop if available
        run: |
          node scripts/verify-hotkeys.mjs --fixture-exe apps/desktop/src-tauri/target/release/quickpick-fixture.exe
          set "QUICKPICK_TOOL_EXIT=%ERRORLEVEL%"
          if "%QUICKPICK_TOOL_EXIT%"=="2" (
            echo Windows interactive hotkeys: NOT RUN; manual acceptance still pending.>> "%GITHUB_STEP_SUMMARY%"
            exit /b 0
          )
          if "%QUICKPICK_TOOL_EXIT%"=="0" echo Windows interactive hotkeys: PASSED.>> "%GITHUB_STEP_SUMMARY%"
          exit /b %QUICKPICK_TOOL_EXIT%
      - name: Capture only fixed fixture UI if the desktop supports PrintWindow
        run: |
          node tools/capture-readme-screenshots.mjs --fixture-exe apps/desktop/src-tauri/target/release/quickpick-fixture.exe --output-dir tool-validation --themes light,dark --languages zh-Hans,en --include-screenshot
          set "QUICKPICK_TOOL_EXIT=%ERRORLEVEL%"
          if "%QUICKPICK_TOOL_EXIT%"=="2" (
            echo Fixed fixture UI capture: NOT RUN; manual acceptance still pending.>> "%GITHUB_STEP_SUMMARY%"
            exit /b 0
          )
          if "%QUICKPICK_TOOL_EXIT%"=="0" echo Fixed fixture UI capture: PASSED.>> "%GITHUB_STEP_SUMMARY%"
          exit /b %QUICKPICK_TOOL_EXIT%
