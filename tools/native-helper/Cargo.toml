[package]
name = "quickpick-native-helper"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Isolated QuickPick development resource and Windows acceptance tools"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_UI_HiDpi", "Win32_Storage_Xps", "Win32_System_JobObjects", "Win32_Security"] }

[profile.release]
opt-level = "s"
strip = true
