[package]
name = "quickpick-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
sys-locale = "=0.3.2"
keyboard-types = "=0.8.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "system-proxy"] }
base64 = "=0.22.1"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }
